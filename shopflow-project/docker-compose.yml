
# docker-compose.yml
#
# ShopFlow - Complete Docker Compose
#
# Startup order:
#
# MySQL
#   ↓
# Auth / Product / Notification
#   ↓
# Order
#   ↓
# Payment
#   ↓
# API Gateway
#   ↓
# Frontend / Admin Dashboard
#
# MySQL is controlled using a healthcheck.
# Backend services use application healthchecks.
# Dependencies wait for HEALTHY services rather than merely STARTED containers.


# ─────────────────────────────────────────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────────────────────────────────────────

networks:
  shopflow-network:
    driver: bridge


# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENT STORAGE
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  mysql-data:


# ─────────────────────────────────────────────────────────────────────────────
# SERVICES
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ===========================================================================
  # MYSQL
  # ===========================================================================

  mysql:
    image: mysql:8.0
    container_name: shopflow-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

    networks:
      - shopflow-network

    # MySQL can take considerable time on first initialization,
    # especially when mysql-init contains multiple SQL scripts.
    #
    # Give MySQL 60 seconds before healthchecking.
    # Then check every 10 seconds.
    # Allow up to 30 failed checks.

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s


  # ===========================================================================
  # AUTH SERVICE
  # ===========================================================================

  auth-service:
    build: ./auth-service
    image: harishgundimeda/shopflow-project-auth-service:latest
    container_name: shopflow-auth-service
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: auth_db
      PORT: 8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: 24

    ports:
      - "8001:8001"

    networks:
      - shopflow-network

    depends_on:
      mysql:
        condition: service_healthy

    # Use Python instead of curl.
    # This avoids depending on curl being installed inside the image.

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ===========================================================================
  # PRODUCT SERVICE
  # ===========================================================================

  product-service:
    build: ./product-service
    image: harishgundimeda/shopflow-project-product-service:latest
    container_name: shopflow-product-service
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: product_db
      PORT: 8002
      AUTH_SERVICE_URL: http://auth-service:8001

    ports:
      - "8002:8002"

    networks:
      - shopflow-network

    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ===========================================================================
  # NOTIFICATION SERVICE
  # ===========================================================================

  notification-service:
    build: ./notification-service
    image: harishgundimeda/shopflow-project-notification-service:latest
    container_name: shopflow-notification-service
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: notification_db
      PORT: 8005
      AUTH_SERVICE_URL: http://auth-service:8001

      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-ShopFlow <noreply@shopflow.com>}

    ports:
      - "8005:8005"

    networks:
      - shopflow-network

    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ===========================================================================
  # ORDER SERVICE
  # ===========================================================================

  order-service:
    build: ./order-service
    image: harishgundimeda/shopflow-project-order-service:latest
    container_name: shopflow-order-service
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: order_db
      PORT: 8003

      AUTH_SERVICE_URL: http://auth-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8005

    ports:
      - "8003:8003"

    networks:
      - shopflow-network

    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ===========================================================================
  # PAYMENT SERVICE
  # ===========================================================================

  payment-service:
    build: ./payment-service
    image: harishgundimeda/shopflow-project-payment-service:latest
    container_name: shopflow-payment-service
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: payment_db
      PORT: 8004

      AUTH_SERVICE_URL: http://auth-service:8001
      ORDER_SERVICE_URL: http://order-service:8003
      PAYMENT_SUCCESS_RATE: 0.95

    ports:
      - "8004:8004"

    networks:
      - shopflow-network

    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ===========================================================================
  # API GATEWAY
  # ===========================================================================

  api-gateway:
    build: ./api-gateway
    image: harishgundimeda/shopflow-project-api-gateway:latest
    container_name: shopflow-api-gateway
    restart: unless-stopped

    environment:
      PORT: 8000

      AUTH_SERVICE_URL: http://auth-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
      ORDER_SERVICE_URL: http://order-service:8003
      PAYMENT_SERVICE_URL: http://payment-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005

      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4200

    ports:
      - "8000:8000"

    networks:
      - shopflow-network

    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  # ===========================================================================
  # REACT FRONTEND
  # ===========================================================================

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""

    image: harishgundimeda/shopflow-project-frontend:latest
    container_name: shopflow-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    networks:
      - shopflow-network

    depends_on:
      api-gateway:
        condition: service_healthy


  # ===========================================================================
  # ANGULAR ADMIN DASHBOARD
  # ===========================================================================

  admin-dashboard:
    build:
      context: ./admin-dashboard

    image: harishgundimeda/shopflow-project-admin-dashboard:latest
    container_name: shopflow-admin-dashboard
    restart: unless-stopped

    ports:
      - "4200:80"

    networks:
      - shopflow-network

    depends_on:
      api-gateway:
        condition: service_healthy